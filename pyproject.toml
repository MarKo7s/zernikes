[project]
name = "zernikes"
version = "1.0.0"
description = "ModeLab Zernike basis and phase-mask synthesis for SLM holography"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0,<2.6",
  "numexpr>=2.8",
]

[project.optional-dependencies]
gui = [
  "PySide6>=6.5",
  "pyqtgraph>=0.13",
]
notebooks = [
  "jupyter>=1.0",
  "ipykernel>=6.0",
  "pandas>=2.0",
]

[project.urls]
Repository = "https://github.com/MarKo7s/zernikes"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"zernikes" = "."}
packages = [
  "zernikes",
  "zernikes.ui",
]
